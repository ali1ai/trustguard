[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trustguard"
version = "0.2.2"
description = "An auditable, human-in-the-loop content risk analysis platform with leak-resistant ML benchmarking."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "python-dotenv>=1.0,<2.0",
  "scikit-learn>=1.5,<2.0",
  "joblib>=1.4,<2.0",
]

[project.optional-dependencies]
llm = ["openai>=1.50,<3.0"]
dev = ["pytest>=8.3,<10.0", "httpx>=0.27,<1.0", "ruff>=0.7,<1.0"]
training = ["datasets>=3.0,<5.0"]
notebook = ["jupyterlab>=4.2,<5.0", "ipykernel>=6.29,<7.0", "pandas>=2.2,<4.0", "matplotlib>=3.9,<4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
